<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">
  <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="{{ slotId }}" fit="contain" shape="{{ shapeVal }}" placeholder="{{ label }}" hint-size="100%,100%" style="width:100%;height:100%;display:block;"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:210,&quot;height&quot;:170},&quot;animal&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cat&quot;,&quot;corgi&quot;],&quot;default&quot;:&quot;cat&quot;,&quot;tsType&quot;:&quot;'cat'|'corgi'&quot;},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;warn&quot;,&quot;critical&quot;,&quot;exhausted&quot;],&quot;default&quot;:&quot;ok&quot;,&quot;tsType&quot;:&quot;'ok'|'warn'|'critical'|'exhausted'&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const a = this.props.animal === 'corgi' ? 'corgi' : 'cat';
    const m = ['ok','warn','critical','exhausted'].includes(this.props.mood) ? this.props.mood : 'ok';
    const key = m === 'ok' ? 'idle' : 'idle_' + m;
    return {
      slotId: `pet-${a}-${m}`,
      shapeVal: this.props.shape === 'circle' ? 'circle' : 'rect',
      label: `${a} · ${key}`,
    };
  }
}
</script>
</body>
</html>
