[package]
name = "cachebite"
version = "0.1.0"
description = "A local desktop pet for Claude and Codex usage"
authors = ["CacheBite contributors"]
edition = "2021"
rust-version = "1.77.2"

[features]
default = ["tauri-ipc"]
tauri-ipc = []

[lib]
name = "cachebite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.5", features = [] }
tauri-plugin-notification = "2.3.3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time", "test-util"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
