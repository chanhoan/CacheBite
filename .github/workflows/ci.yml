name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CACHEBITE_E2E_FIXTURES: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci
      - name: Renderer E2E against fixture-only mode
        run: pnpm test:e2e:renderer
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features
      - run: pnpm audit:ci
      - run: pnpm licenses:check > production-licenses.json
      - run: python3 scripts/build_updater_manifest.py --self-test
      - name: Rust dependency advisory gate
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock
      - name: Secret and production-endpoint guard
        run: |
          ! git grep -nEi '(sk-[a-z0-9_-]{16,}|bearer [a-z0-9._-]{16,})' -- ':!tests/fixtures/**' ':!docs/**'
          ! git grep -nE 'https://(api\.anthropic\.com|chatgpt\.com)' -- 'src/**' 'tests/**'
          # The updater's signing key is the root of trust for every installed
          # client. Only the public half belongs in tauri.conf.json.
          minisign_marker_prefix='untrusted comment: minisign '
          minisign_marker_suffix='encrypted secret key'
          private_key_marker="${minisign_marker_prefix}${minisign_marker_suffix}"
          ! git grep -nF "$private_key_marker"
