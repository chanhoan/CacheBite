name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      production_macos_signing:
        description: Use the protected signing environment for a notarized macOS build
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            target_flag: ''
            bundle_root: src-tauri/target/release/bundle
            artifact: windows-installers
            paths: |
              src-tauri/target/release/bundle/nsis/*
              src-tauri/target/release/bundle/msi/*
          # One universal DMG rather than a DMG per architecture: a tester on an
          # unsigned beta should not have to know whether their Mac is Intel or
          # Apple Silicon to pick the right download. Naming a target also moves
          # the bundle under target/<triple>/, hence bundle_root.
          # `app` is bundled alongside `dmg` because the updater artifact is
          # the `.app.tar.gz`, which only the `app` target produces. The DMG
          # stays the thing a human downloads.
          - os: macos-latest
            bundles: app,dmg
            target_flag: '--target universal-apple-darwin'
            bundle_root: src-tauri/target/universal-apple-darwin/release/bundle
            artifact: macos-unsigned-validation-dmg
            paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz*
          - os: ubuntu-latest
            bundles: appimage
            target_flag: ''
            bundle_root: src-tauri/target/release/bundle
            artifact: linux-appimage
            paths: src-tauri/target/release/bundle/appimage/*
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10.15.1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      # A universal binary is lipo'd from both slices, so both have to be
      # installed even though the runner only builds natively for one.
      - name: Add the macOS universal build targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features
      # The git tag is the single source of truth for the shipped version.
      # `tauri.conf.json` stays at a plain `0.1.0`, which semver ranks *above*
      # every `0.1.0-beta.N`; shipping that would make the updater refuse
      # every real release. `bash` on Windows too, or PowerShell eats the heredoc.
      - name: Derive the release version from the tag
        shell: bash
        run: |
          # This workflow also answers workflow_dispatch, which can run off a
          # branch. A branch has no release version, so it gets an empty merge
          # config and no signed updater artifacts rather than a bogus version.
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > src-tauri/tauri.release.conf.json
            cat src-tauri/tauri.release.conf.json
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "$VERSION" ] || { echo "empty tag name"; exit 1; }
          # WiX rejects a non-numeric pre-release, so the MSI gets a numeric
          # ProductVersion derived from the trailing number of the pre-release.
          CORE="${VERSION%%-*}"
          case "$VERSION" in
            *-*) WIX_BUILD="$(printf '%s' "$VERSION" | sed -n 's/.*[^0-9]\([0-9][0-9]*\)$/\1/p')" ;;
            *)   WIX_BUILD=0 ;;
          esac
          WIX_BUILD="${WIX_BUILD:-0}"
          python3 - "$VERSION" "$CORE.$WIX_BUILD" <<'PY' > src-tauri/tauri.release.conf.json
          import json, sys
          print(json.dumps({
              "version": sys.argv[1],
              "bundle": {
                  "createUpdaterArtifacts": True,
                  "windows": {"wix": {"version": sys.argv[2]}},
              },
          }, indent=2))
          PY
          cat src-tauri/tauri.release.conf.json
      - run: pnpm tauri build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }} ${{ matrix.target_flag }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # `CacheBite.app.tar.gz` is the same name in every release, which makes a
      # manifest URL ambiguous across versions. Both files move together so the
      # artifact and its signature stay paired.
      - name: Name the macOS updater artifact after the release
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        shell: bash
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          BASE="CacheBite_${GITHUB_REF_NAME#v}_universal.app.tar.gz"
          mv CacheBite.app.tar.gz     "$BASE"
          mv CacheBite.app.tar.gz.sig "$BASE.sig"
      - name: Create SHA-256 checksums (Unix)
        if: runner.os != 'Windows'
        run: find ${{ matrix.bundle_root }} -type f -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt
      - name: Create SHA-256 checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem ${{ matrix.bundle_root }} -Recurse -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path)" } | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.paths }}
            SHA256SUMS.txt
          if-no-files-found: error

  # Tag pushes collect the platform artifacts into a single GitHub release so
  # testers can download without a GitHub account. The release is always a
  # draft: publishing stays a deliberate human action, and nothing is public
  # until someone reviews the attached installers.
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Collect installers
        run: |
          mkdir -p release
          # `.sig` and `.tar.gz` ride along because the updater manifest is
          # built from them: the signature is read verbatim, and the macOS
          # archive is the artifact the client actually installs.
          find artifacts -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.sig' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          test -n "$(ls -A release)" || { echo "no installers were produced"; exit 1; }
          # Recomputed here rather than merged from the per-platform files: the
          # Windows job records absolute runner paths, so a merge would ship
          # checksums nobody can verify against a downloaded file name.
          (cd release && sha256sum -- * > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt release/
          cat release/SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag with a hyphen is a pre-release by semver (v0.1.0-beta.1).
          case "$TAG" in *-*) PRERELEASE=--prerelease ;; *) PRERELEASE= ;; esac
          cat > notes.md <<'NOTES'
          Installers are **not code-signed**. Windows SmartScreen and macOS
          Gatekeeper will warn or block on first launch — `docs/beta-testing.md`
          in this repository has the per-platform steps, what to report, and
          what never to paste into an issue.

          Verify a download against `SHA256SUMS.txt` before installing.

          CacheBite checks for newer signed releases and offers them in the
          panel with **Install** and **Later**. Installing downloads the build
          for your platform, verifies its signature, installs it over the
          current one, and restarts CacheBite.

          Builds up to and including `v0.1.0-beta.3` predate the updater and
          cannot update themselves. Install the first updater-enabled release
          by hand once; later ones arrive in-app.

          In-app installation is verified on Windows. macOS and Linux artifacts
          are published and signed and the app will attempt the install, but
          replacing an unsigned macOS bundle and rewriting a running AppImage
          are not yet confirmed on real hardware. If it fails there the panel
          says so, your existing build keeps running, and you can install by
          hand — please report it.
          NOTES
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file notes.md \
            --draft \
            $PRERELEASE \
            release/*

  signed-notarized-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.production_macos_signing
    runs-on: macos-latest
    timeout-minutes: 60
    environment: production-macos-signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10.15.1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - name: Add the macOS universal build targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - name: Derive the release version from the tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > src-tauri/tauri.release.conf.json
            cat src-tauri/tauri.release.conf.json
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          CORE="${VERSION%%-*}"
          case "$VERSION" in
            *-*) WIX_BUILD="$(printf '%s' "$VERSION" | sed -n 's/.*[^0-9]\([0-9][0-9]*\)$/\1/p')" ;;
            *)   WIX_BUILD=0 ;;
          esac
          WIX_BUILD="${WIX_BUILD:-0}"
          python3 - "$VERSION" "$CORE.${WIX_BUILD:-0}" <<'PY' > src-tauri/tauri.release.conf.json
          import json, sys
          print(json.dumps({
              "version": sys.argv[1],
              "bundle": {
                  "createUpdaterArtifacts": True,
                  "windows": {"wix": {"version": sys.argv[2]}},
              },
          }, indent=2))
          PY
          cat src-tauri/tauri.release.conf.json
      - name: Validate protected signing inputs
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: test -n "$APPLE_CERTIFICATE" && test -n "$APPLE_CERTIFICATE_PASSWORD" && test -n "$APPLE_SIGNING_IDENTITY" && test -n "$APPLE_ID" && test -n "$APPLE_PASSWORD" && test -n "$APPLE_TEAM_ID"
      - name: Build signed and notarized DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Without these the DMG would carry the committed `0.1.0` while every
          # other artifact in the release carries the tag version.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json --bundles dmg --target universal-apple-darwin
      - run: find src-tauri/target/universal-apple-darwin/release/bundle/dmg -type f -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-signed-notarized-dmg
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*
            SHA256SUMS.txt
          if-no-files-found: error
